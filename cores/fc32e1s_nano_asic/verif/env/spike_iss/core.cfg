# ============================================================
#  core.cfg -- per-core settings for the Spike ISS <-> RTL flow.
#  Sourced (bash) by run_spike.sh, ../core/run_core_rtl.sh and
#  run_core_tests.sh. Everything core-specific lives here so the
#  scripts stay generic.
# ============================================================

CORE_NAME="fc32e1s_nano_asic"

# ISA: fc32e1s_nano_asic is RV32E restricted to 6 registers: x0, x1 (ra), x2 (sp),
# x10..x12 (a0..a2). No M, no C, no Zicsr, no traps. Any other register field
# is an illegal instruction in the RTL.
# Tests are assembled with -march=$MARCH so any M/C/CSR instruction or any
# x16..x31 is a hard build error; run_spike.sh additionally scans the
# disassembly and fails a test that names x3..x9 or x13..x15 (TINY_REGS below).
MARCH="rv32e"
MABI="ilp32e"
SPIKE_ISA="rv32e"
XVLOG_DEFINES=""
COVERAGE_ISA="rv32i"   # RV32E has the same instruction list as RV32I

# Shared testbench models compiled with the TB (relative to <repo>/common/tb).
TB_COMMON_FILES=(axil_mem_model.sv axil_master_checker.sv)
# Synthesisable shared memories the TB can use instead (AXI_MEM=rtl), <repo>/common/rtl.
COMMON_RTL_FILES=(sdp_ram.sv axil_imem.sv axil_dmem.sv)
# Core-level wrappers outside rtl/ (none for fc32e1s_nano_asic).
CORE_EXTRA_FILES=()

# Memory map -- must match env/core_test.ld and ../core/tb_fc32e1s_nano_asic_spike.sv
# IMEM is at 0x8000_0000, not 0x0: spike's debug module occupies 0x0-0xFFF
# (see env/core_test.ld).
IMEM_BASE="0x80000000"
DMEM_BASE="0x20000000"
SPIKE_MEM="0x80000000:0x1000,0x20000000:0x2000"
TOHOST_ADDR="20001fc0"

# basic_isa_tests / directed_functional_tests of fc32e1s were dropped: they
# use t/s registers throughout. tiny_tests are hand-written for the 6-register
# set; random_tests and c_tests are generated (gen_tests.py, run by run_spike.sh).
TEST_GROUPS=(riscv_tests tiny_tests random_tests c_tests)

# Registers a test may name (objdump -M numeric). Anything else fails the test.
TINY_REGS="0 1 2 10 11 12"

# Generated outputs (ELF, hex, disassembly, traces, coverage) go under the
# core's verif/build/ directory, never next to the sources.
# CFG_DIR is set by the sourcing script to this file's directory.
BUILD_DIR="$CFG_DIR/../../build/spike_$MARCH"

# ------------------------------------------------------------
# Tests that cannot run on this core. Listed explicitly with the reason so
# a skip is always visible in the report, never a silent build failure.
# ------------------------------------------------------------
declare -A SKIP=(
  [mul]="RV32M"  [mulh]="RV32M"  [mulhsu]="RV32M"  [mulhu]="RV32M"
  [div]="RV32M"  [divu]="RV32M"  [rem]="RV32M"     [remu]="RV32M"
)

