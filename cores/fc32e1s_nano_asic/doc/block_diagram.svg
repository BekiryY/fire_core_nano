<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>fc32e1s_nano_asic_core block diagram</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2430"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/>
    </marker>
    <style>
      .mod  { fill: #eef3fb; stroke: #3b5b8c; stroke-width: 1.5; }
      .grp  { fill: none; stroke: #9aa8bd; stroke-width: 1; stroke-dasharray: 5 4; }
      .port { fill: #fdf0e3; stroke: #c46a10; stroke-width: 2; }
      .fsm  { fill: #e8f5ec; stroke: #2e7d4f; stroke-width: 1.5; }
      .w    { fill: none; stroke: #1b2430; stroke-width: 1.4; marker-end: url(#a); }
      .ctl  { fill: none; stroke: #2e7d4f; stroke-width: 1.2; stroke-dasharray: 4 3; marker-end: url(#ag); }
      .off  { fill: none; stroke: #b0b0b0; stroke-width: 1.2; stroke-dasharray: 3 3; }
      .t    { fill: #1b2430; }
      .b    { font-weight: bold; }
      .s    { font-size: 10.5px; fill: #44506a; }
      .h    { font-size: 10.5px; fill: #7a879c; font-weight: bold; letter-spacing: 1px; }
      .pt   { fill: #8a4a0a; }
      .g    { fill: #9a9a9a; font-size: 10.5px; }
      .lbl  { font-size: 10.5px; fill: #1b2430; }
      .lblg { font-size: 10.5px; fill: #2e7d4f; }
    </style>
  </defs>

  <rect width="1100" height="560" fill="#ffffff"/>

  <!-- core boundary -->
  <rect x="160" y="60" width="780" height="470" rx="10" fill="#fafbfd" stroke="#1b2430" stroke-width="2"/>
  <text x="172" y="80" class="t b" font-size="14">fc32e1s_nano_asic_core</text>
  <text x="172" y="96" class="s">RV32E, 6 registers, single-stage, byte-serial</text>

  <!-- clock / reset, status -->
  <line x1="230" y1="30" x2="230" y2="58" class="w"/>
  <text x="238" y="38" class="lbl">clk_i, rst_ni</text>
  <line x1="610" y1="85" x2="610" y2="32" class="w"/>
  <text x="618" y="38" class="lbl">halt_o, illegal_o, bus_err_o (sticky)</text>

  <!-- control FSM -->
  <rect x="400" y="85" width="300" height="55" rx="6" class="fsm"/>
  <text x="550" y="106" text-anchor="middle" class="t b">control FSM</text>
  <text x="550" y="124" text-anchor="middle" class="s">RESET → FETCH → EXEC (1+ cycles) → FETCH</text>

  <!-- ===== AXI4-Lite instruction port ===== -->
  <rect x="20" y="180" width="120" height="250" rx="6" class="port"/>
  <text x="80" y="200" text-anchor="middle" class="pt b">m_axi_i_*</text>
  <text x="80" y="215" text-anchor="middle" class="s">AXI4-Lite master</text>
  <text x="80" y="228" text-anchor="middle" class="s">instruction</text>
  <text x="32" y="250" class="pt b">AR</text>
  <text x="32" y="280" class="pt b">R</text>
  <text x="32" y="350" class="g">AW</text>
  <text x="32" y="372" class="g">W</text>
  <text x="32" y="394" class="g">B</text>
  <text x="58" y="372" class="g">tied off</text>
  <text x="58" y="384" class="g">(read-only)</text>

  <!-- ===== AXI4-Lite data port ===== -->
  <rect x="960" y="180" width="120" height="250" rx="6" class="port"/>
  <text x="1020" y="200" text-anchor="middle" class="pt b">m_axi_d_*</text>
  <text x="1020" y="215" text-anchor="middle" class="s">AXI4-Lite master</text>
  <text x="1020" y="228" text-anchor="middle" class="s">data</text>
  <text x="1050" y="259" class="pt b">AW</text>
  <text x="1050" y="289" class="pt b">W</text>
  <text x="1050" y="319" class="pt b">B</text>
  <text x="1050" y="349" class="pt b">AR</text>
  <text x="1050" y="379" class="pt b">R</text>

  <!-- ===== FETCH ===== -->
  <rect x="180" y="180" width="130" height="230" rx="6" class="grp"/>
  <text x="188" y="194" class="h">FETCH</text>
  <rect x="195" y="205" width="100" height="85" rx="5" class="mod"/>
  <text x="245" y="225" text-anchor="middle" class="t b">u_fetch</text>
  <text x="245" y="243" text-anchor="middle" class="s">AR / R handshake</text>
  <text x="245" y="257" text-anchor="middle" class="s">instruction</text>
  <text x="245" y="270" text-anchor="middle" class="s">register (32 b)</text>
  <rect x="195" y="330" width="100" height="60" rx="5" class="mod"/>
  <text x="245" y="352" text-anchor="middle" class="t b">u_pc</text>
  <text x="245" y="369" text-anchor="middle" class="s">PC (11 b), pc + 4</text>

  <!-- ===== DECODE ===== -->
  <rect x="335" y="180" width="130" height="230" rx="6" class="grp"/>
  <text x="343" y="194" class="h">DECODE</text>
  <rect x="350" y="205" width="100" height="80" rx="5" class="mod"/>
  <text x="400" y="225" text-anchor="middle" class="t b">u_decoder</text>
  <text x="400" y="243" text-anchor="middle" class="s">ctrl bundle</text>
  <text x="400" y="257" text-anchor="middle" class="s">illegal: other regs,</text>
  <text x="400" y="270" text-anchor="middle" class="s">CSR, unsupported</text>
  <rect x="350" y="320" width="100" height="70" rx="5" class="mod"/>
  <text x="400" y="342" text-anchor="middle" class="t b">u_immgen</text>
  <text x="400" y="360" text-anchor="middle" class="s">I / S / B / U / J</text>
  <text x="400" y="374" text-anchor="middle" class="s">immediates</text>

  <!-- ===== REGISTER FILE ===== -->
  <rect x="490" y="205" width="130" height="205" rx="5" class="mod"/>
  <text x="555" y="225" text-anchor="middle" class="t b">u_regfile</text>
  <text x="555" y="245" text-anchor="middle" class="s">6 × 32 b latches</text>
  <text x="555" y="259" text-anchor="middle" class="s">x0 ra sp a0 a1 a2</text>
  <text x="555" y="281" text-anchor="middle" class="s">1 read port</text>
  <text x="555" y="295" text-anchor="middle" class="s">1 write port,</text>
  <text x="555" y="309" text-anchor="middle" class="s">byte-lane enables</text>
  <text x="555" y="331" text-anchor="middle" class="s">u_clkgate per</text>
  <text x="555" y="345" text-anchor="middle" class="s">byte lane (ICG)</text>

  <!-- ===== EXECUTE ===== -->
  <rect x="645" y="180" width="130" height="230" rx="6" class="grp"/>
  <text x="653" y="194" class="h">EXECUTE</text>
  <rect x="660" y="205" width="100" height="85" rx="5" class="mod"/>
  <text x="710" y="225" text-anchor="middle" class="t b">u_alu8</text>
  <text x="710" y="243" text-anchor="middle" class="s">8-bit ALU,</text>
  <text x="710" y="257" text-anchor="middle" class="s">4 cycles / op,</text>
  <text x="710" y="270" text-anchor="middle" class="s">branch compare</text>
  <text x="710" y="283" text-anchor="middle" class="s">+ addr_q</text>
  <rect x="660" y="320" width="100" height="70" rx="5" class="mod"/>
  <text x="710" y="342" text-anchor="middle" class="t b">u_shift</text>
  <text x="710" y="360" text-anchor="middle" class="s">multi-step</text>
  <text x="710" y="374" text-anchor="middle" class="s">shifter</text>

  <!-- ===== MEMORY ===== -->
  <rect x="800" y="180" width="125" height="230" rx="6" class="grp"/>
  <text x="808" y="194" class="h">MEMORY</text>
  <rect x="812" y="220" width="100" height="180" rx="5" class="mod"/>
  <text x="862" y="268" text-anchor="middle" class="t b">u_lsu</text>
  <text x="862" y="286" text-anchor="middle" class="s">load / store</text>
  <text x="862" y="300" text-anchor="middle" class="s">byte strobes,</text>
  <text x="862" y="314" text-anchor="middle" class="s">sign / zero</text>
  <text x="862" y="328" text-anchor="middle" class="s">extension</text>

  <!-- ===== wires ===== -->
  <!-- I port -->
  <line x1="195" y1="245" x2="142" y2="245" class="w"/>
  <text x="148" y="240" class="lbl">pc</text>
  <line x1="140" y1="275" x2="193" y2="275" class="w"/>
  <text x="148" y="290" class="lbl">instr</text>

  <!-- pc -> fetch -->
  <line x1="245" y1="330" x2="245" y2="292" class="w"/>
  <text x="251" y="316" class="lbl">pc</text>

  <!-- instr -> decoder / immgen -->
  <polyline points="295,260 322,260 322,245 348,245" class="w"/>
  <polyline points="322,260 322,355 348,355" class="w"/>
  <text x="300" y="300" class="lbl" transform="rotate(-90 318 300)">instr</text>

  <!-- decoder -> regfile (register addresses) -->
  <line x1="450" y1="235" x2="488" y2="235" class="w"/>
  <text x="456" y="229" class="lbl">rs/rd</text>

  <!-- imm -> alu8 (under the register file) -->
  <polyline points="450,375 475,375 475,430 635,430 635,272 658,272" class="w"/>
  <text x="480" y="445" class="lbl">imm</text>

  <!-- regfile -> alu8 / shift -->
  <line x1="620" y1="232" x2="658" y2="232" class="w"/>
  <text x="624" y="226" class="lbl">rs1/rs2</text>
  <line x1="620" y1="355" x2="658" y2="355" class="w"/>
  <text x="639" y="349" class="lbl">rs1</text>

  <!-- alu8 -> lsu address -->
  <line x1="760" y1="245" x2="810" y2="245" class="w"/>
  <text x="766" y="239" class="lbl">addr</text>

  <!-- store data -->
  <polyline points="555,410 555,465 862,465 862,402" class="w"/>
  <text x="600" y="480" class="lbl">rs2 store data</text>

  <!-- write-back bus -->
  <polyline points="890,220 890,160 555,160 555,203" class="w"/>
  <line x1="740" y1="205" x2="740" y2="160" stroke="#1b2430" stroke-width="1.4"/>
  <polyline points="760,370 785,370 785,160" fill="none" stroke="#1b2430" stroke-width="1.4"/>
  <circle cx="740" cy="160" r="2.5" fill="#1b2430"/>
  <circle cx="785" cy="160" r="2.5" fill="#1b2430"/>
  <text x="590" y="154" class="lbl">rd write-back: ALU byte · shift · load data · pc + 4</text>

  <!-- branch / jump target -> pc -->
  <polyline points="725,410 725,505 245,505 245,392" class="w"/>
  <text x="400" y="499" class="lbl">branch / JAL / JALR target, redirect</text>

  <!-- D port channels -->
  <line x1="912" y1="255" x2="958" y2="255" class="w"/>
  <line x1="912" y1="285" x2="958" y2="285" class="w"/>
  <line x1="958" y1="315" x2="914" y2="315" class="w"/>
  <line x1="912" y1="345" x2="958" y2="345" class="w"/>
  <line x1="958" y1="375" x2="914" y2="375" class="w"/>

  <!-- control -->
  <polyline points="400,112 245,112 245,178" class="ctl"/>
  <text x="252" y="126" class="lblg">fetch req / commit</text>
  <line x1="420" y1="203" x2="420" y2="142" class="ctl"/>
  <text x="426" y="176" class="lblg">ctrl</text>
  <polyline points="905,220 905,112 702,112" class="ctl"/>
  <text x="790" y="106" class="lblg">lsu done / err</text>
</svg>
