    li1: {res: 0.07529412, cap: 0.00014467}
    met1: {res: 0.0008928571, cap: 0.00013983}
    met2: {res: 0.0008928571, cap: 0.00012852}
    met3: {res: 0.0001566667, cap: 0.00014139}
    met4: {res: 0.0001566667, cap: 0.0001252}
    met5: {res: 1.78125e-05, cap: 0.00014489}
